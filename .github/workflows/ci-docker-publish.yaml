name: CI Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (latest or dev)
        required: true
        default: latest
        type: choice
        options:
          - latest
          - dev

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Detect release channel
        id: channel
        run: |
          if [[ -n "${{ github.event.inputs.channel }}" ]]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          else
            BRANCH="${{ github.ref_name }}"

            if [[ "$BRANCH" == "main" ]]; then
              CHANNEL="latest"
            else
              echo "Unknown branch: $BRANCH"
              exit 1
            fi
          fi

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Detected channel: $CHANNEL"

      - name: Extract version and generate tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          CHANNEL="${{ steps.channel.outputs.channel }}"
          REPO_PATH=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          APP_VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/${REPO_PATH}"

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${IMAGE}:${CHANNEL}" >> $GITHUB_OUTPUT
          echo "sha_tag=${IMAGE}:${CHANNEL}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}-${CHANNEL}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image pushed
        run: |
          echo "Image pushed with tags:"
          echo "  ${{ steps.meta.outputs.tag }}"
          echo "  ${{ steps.meta.outputs.sha_tag }}"
          echo "App version: ${{ steps.meta.outputs.app_version }}"
